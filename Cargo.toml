[package]
name = "hashchan-node"
version = "0.1.0"
edition = "2024"
description = "HashChan node with embedded GUI"
authors = ["HashChan Team"]

[dependencies]
reth = { git = "https://github.com/paradigmxyz/reth.git"  } # Reth
reth-exex = { git = "https://github.com/paradigmxyz/reth.git"  } # Execution Extensions
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git"  } # Ethereum Node implementation
reth-tracing = { git = "https://github.com/paradigmxyz/reth.git"  } # Logging

eyre = "0.6" # Easy error handling
futures-util = "0.3" # Stream utilities for consuming notifications
rusqlite = { version = "0.29.0", features = ["bundled"] } # SQLite with bundled SQLite library
chrono = "0.4" # For timestamp handling
ethabi = "18.0.0" # Ethereum ABI encoding/decoding
hex = "0.4.3" # Hex encoding/decoding
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
alloy-primitives = { version = "1.3.1", features = ["serde"] }
alloy-consensus = "1.0.32"
libc = "0.2" # For process signals

# GUI dependencies
egui = "0.32.3"
eframe = { version = "0.32.3", features = ["persistence"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
poll-promise = "0.3.0" # For async operations in egui
env_logger = "0.10.1" # Logging for the application
log = "0.4.20" # Logging facade
directories = "5.0.1" # For finding platform-specific directories
