version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hashchan
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Reth node service (execution client)
  reth:
    build:
      context: .
      dockerfile: ./reth/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hashchan
    volumes:
      - reth-data:/app/data
      - ./reth:/usr/src/reth
      - jwt-secret:/app/jwt
    ports:
      - "8545:8545"  # JSON-RPC API
      - "8546:8546"  # WebSocket API
      - "30303:30303"  # P2P
      - "30303:30303/udp"  # P2P UDP
      - "8551:8551"  # Engine API for consensus client
    develop:
      watch:
        - action: rebuild
          path: ./reth/src
          target: /usr/src/reth/reth-service/src

  # UI service
  ui:
    build:
      context: .
      dockerfile: ./ui/Dockerfile
    depends_on:
      - postgres
      - reth
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hashchan
      RETH_API_URL: http://reth:8545
    ports:
      - "8000:8000"  # UI interface
    volumes:
      - ./ui:/usr/src/ui
    develop:
      watch:
        - action: rebuild
          path: ./ui/src
          target: /usr/src/ui/ui-service/src

  # Lighthouse consensus client
  lighthouse:
    image: sigp/lighthouse:latest
    depends_on:
      - reth
    command: >
      lighthouse beacon
      --network sepolia
      --execution-endpoint http://reth:8551
      --execution-jwt /jwt/jwt.hex
      --checkpoint-sync-url https://beaconstate-sepolia.chainsafe.io
      --http
      --http-address 0.0.0.0
      --disable-deposit-contract-sync
    volumes:
      - lighthouse-data:/root/.lighthouse
      - jwt-secret:/jwt
    ports:
      - "9000:9000/tcp"
      - "9000:9000/udp"
      - "9001:9001/udp"
      - "5052:5052"

volumes:
  postgres-data:
  reth-data:
  lighthouse-data:
  jwt-secret:
