[package]
name = "reth-service"
version = "0.1.0"
edition = "2021"
description = "HashChan Reth node service"
authors = ["HashChan Team"]

[dependencies]
reth = { git = "https://github.com/paradigmxyz/reth.git" }
reth-exex = { git = "https://github.com/paradigmxyz/reth.git" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth.git" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth.git" }

# Database dependencies
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = "0.12.1"
bytes = "1.5.0"

# Utility dependencies
eyre = "0.6"
futures-util = "0.3"
futures-executor = "0.3"
chrono = "0.4"
ethabi = "18.0.0"
hex = "0.4.3"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
alloy-primitives = { version = "1.3.1", features = ["serde"] }
alloy-consensus = "1.0.32"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.20"
env_logger = "0.10.1"
thiserror = "1.0"

[lib]
name = "reth_service"
path = "src/lib.rs"

[[bin]]
name = "reth-service"
path = "src/main.rs"
