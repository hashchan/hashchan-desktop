# Configuration for HashChan3-focused ultra light Reth node

[prune]
# Run pruning every 5 blocks
block_interval = 5

[prune.segments]
# Prune transaction senders (we don't need them for contract event indexing)
sender_recovery = "full"

# Prune transaction lookups (we don't need them for contract event indexing)
transaction_lookup = "full"

# Prune all account history (we only care about the contract events)
account_history = "full"

# Prune all storage history (we only care about the contract events)
storage_history = "full"

# Prune all bodies history (we only care about the contract events)
bodies_history = "full"

# Only keep receipts for our target contract
[prune.segments.receipts_log_filter]
# HashChan3 contract address
"0x458c27D5a6421AfAFF435e27E870584Fe03a938F" = { distance = 0 }  # Keep all events from this contract

# Stages configuration for faster syncing
[stages.headers]
downloader_max_concurrent_requests = 100
downloader_min_concurrent_requests = 10
downloader_max_buffered_responses = 200
downloader_request_limit = 1000
commit_threshold = 10000

[stages.bodies]
downloader_request_limit = 200
downloader_stream_batch_size = 1000
downloader_max_buffered_blocks_size_bytes = 1073741824  # 1GB
downloader_min_concurrent_requests = 10
downloader_max_concurrent_requests = 100
