[package]
name = "ui-service"
version = "0.1.0"
edition = "2021"
description = "HashChan UI service using egui"
authors = ["HashChan Team"]

[dependencies]
egui = "0.32.3"
eframe = { version = "0.32.3", features = ["persistence"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
log = "0.4.20"
env_logger = "0.10.1"
eyre = "0.6"
chrono = "0.4"
poll-promise = "0.3.0"
directories = "5.0.1"
hex = "0.4.3"
thiserror = "1.0"

# Database dependencies
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = "0.12.1"
bytes = "1.5.0"

[lib]
name = "ui_service"
path = "src/lib.rs"

[[bin]]
name = "ui-service"
path = "src/main.rs"
